<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Airbnb</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="assets/i18n.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js" type="module"></script>
    <script src="assets/firebase-config.js" type="module"></script>
    <script src="assets/admin.js" type="module"></script>
</head>
<body class="min-h-screen" style="background: url('assets/background.svg') no-repeat center center fixed; background-size: cover;">
    <div class="container mx-auto px-4 py-8 bg-white bg-opacity-90 rounded-lg shadow-lg mt-8">
        <!-- Pantalla de login -->
        <div id="login-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-center mb-6">Acceso al Panel de Administración</h1>
            <form id="login-form" class="space-y-4">
                <div class="form-group">
                    <label for="username" class="block text-gray-700 font-medium mb-2">Usuario</label>
                    <input type="text" id="username" name="username" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="form-group">
                    <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
                    <input type="password" id="password" name="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden">Usuario o contraseña incorrectos</div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 transition duration-300 mb-3">Iniciar sesión</button>
                <a href="index.html" class="block text-center w-full bg-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-400 transition duration-300">Volver a la página principal</a>
            </form>
        </div>

        <!-- Panel de administración -->
        <div id="admin-panel" class="hidden">
            <header class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-blue-600">Panel de Administración</h1>
                <button id="logout-btn" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition duration-300">Cerrar sesión</button>
            </header>

            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4">Formularios enviados</h2>
                
                <!-- Filtros -->
                <div class="mb-6 flex flex-wrap gap-4">
                    <div class="form-group">
                        <label for="date-filter" class="block text-gray-700 font-medium mb-2">Filtrar por fecha</label>
                        <input type="date" id="date-filter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="form-group">
                        <label for="apartment-filter" class="block text-gray-700 font-medium mb-2">Filtrar por apartamento</label>
                        <select id="apartment-filter" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Todos</option>
                            <option value="1">Residencial Camposol</option>
                            <option value="2">Piso Ramón Gallud</option>
                        </select>
                    </div>
                    <div class="form-group self-end">
                        <button id="clear-filters" class="px-3 py-2 bg-gray-200 rounded-md hover:bg-gray-300 transition duration-300">Limpiar filtros</button>
                    </div>
                </div>

                <!-- Tabla de formularios -->
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="py-2 px-4 border-b text-left">Fecha</th>
                                <th class="py-2 px-4 border-b text-left">Apartamento</th>
                                <th class="py-2 px-4 border-b text-left">Huéspedes</th>
                                <th class="py-2 px-4 border-b text-left">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-table">
                            <!-- Los datos se cargarán dinámicamente -->
                            <tr class="submissions-empty-row">
                                <td colspan="4" class="py-4 text-center text-gray-500">No hay formularios enviados</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal de detalles del formulario -->
        <div id="form-details-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
            <div class="bg-white p-6 rounded-lg shadow-lg max-w-4xl w-full max-h-screen overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Detalles del formulario</h2>
                    <button id="close-details-btn" class="text-gray-500 hover:text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                <div id="form-details-content" class="space-y-4">
                    <!-- Los detalles se cargarán dinámicamente -->
                </div>
                <div class="flex justify-end mt-6 space-x-4">
                    <button id="download-pdf-btn" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300">Descargar PDF</button>
                    <button id="close-modal-btn" class="bg-gray-300 px-4 py-2 rounded-md hover:bg-gray-400 transition duration-300">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
