<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00CED1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4169E1;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect x="0" y="0" width="1920" height="540" fill="url(#skyGradient)"/>
  
  <!-- Water -->
  <rect x="0" y="540" width="1920" height="540" fill="url(#waterGradient)"/>
  
  <!-- Beach -->
  <path d="M0,540 Q960,480 1920,540 L1920,1080 L0,1080 Z" fill="#F4D03F" opacity="0.8"/>
  
  <!-- Buildings -->
  <g transform="translate(100,200)">
    <rect x="0" y="0" width="200" height="400" fill="#D35400" opacity="0.9"/>
    <rect x="250" y="50" width="180" height="350" fill="#E67E22" opacity="0.85"/>
    <rect x="480" y="-30" width="220" height="430" fill="#F39C12" opacity="0.8"/>
  </g>
  
  <!-- Palm trees -->
  <g transform="translate(50,450)">
    <path d="M0,0 C20,-40 40,-60 60,-40 C80,-60 100,-40 120,0" stroke="#27AE60" stroke-width="8" fill="none"/>
    <rect x="55" y="0" width="10" height="40" fill="#795548"/>
  </g>
  
  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="200" cy="100" rx="60" ry="30"/>
    <ellipse cx="800" cy="150" rx="80" ry="40"/>
    <ellipse cx="1400" cy="120" rx="70" ry="35"/>
  </g>
</svg>